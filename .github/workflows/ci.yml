name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: carrito_compras
          POSTGRES_USER: carrito_user
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carrito_user -d carrito_compras"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: bash ./mvnw --batch-mode test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/carrito_compras
          SPRING_DATASOURCE_USERNAME: carrito_user
          SPRING_DATASOURCE_PASSWORD: ci-only-password
          H2_CONSOLE_ENABLED: "false"

  container:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
        env:
          DB_PASSWORD: ci-only-password
      - run: docker build --tag productos:ci .
