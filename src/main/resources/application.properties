spring.application.name=productos
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:productosdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

transbank.environment=${TRANSBANK_ENVIRONMENT:integration}
transbank.commerce-code=${TRANSBANK_COMMERCE_CODE:}
transbank.api-key=${TRANSBANK_API_KEY:}
app.frontend-url=${FRONTEND_URL:http://localhost:8080}
app.backend-url=${BACKEND_URL:http://localhost:8080}
